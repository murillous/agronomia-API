<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="600" viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .muted { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6b7280; }
  </style>

  <!-- App bar -->
  <rect x="20" y="20" rx="14" width="940" height="56" fill="#ffffff" stroke="#e5e7eb" />
  <text class="label" x="40" y="54">App Bar</text>

  <!-- Button primary -->
  <rect x="20" y="100" rx="12" width="140" height="40" fill="#0a84ff" />
  <text x="40" y="126" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Primário</text>

  <!-- Button secondary -->
  <rect x="180" y="100" rx="12" width="140" height="40" fill="#ffffff" stroke="#e5e7eb" />
  <text x="200" y="126" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Secundário</text>

  <!-- Card -->
  <rect x="20" y="170" rx="20" width="300" height="160" fill="#ffffff" stroke="#e5e7eb" />
  <text class="label" x="40" y="200">Card</text>
  <text class="muted" x="40" y="220">Conteúdo informativo com sombra suave.</text>

  <!-- Badge green -->
  <rect x="20" y="360" rx="999" width="70" height="24" fill="#34c759" />
  <text x="30" y="376" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">OK</text>

  <!-- Badge red -->
  <rect x="100" y="360" rx="999" width="70" height="24" fill="#ff3b30" />
  <text x="110" y="376" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">ERRO</text>

  <!-- List item -->
  <rect x="360" y="170" rx="12" width="580" height="48" fill="#ffffff" stroke="#e5e7eb" />
  <text class="label" x="380" y="200">Item de lista</text>
  <text class="muted" x="520" y="200">Descrição breve</text>

  <!-- Footer note -->
  <text class="muted" x="20" y="580">Componentes desenhados à mão em SVG para orientar implementação iOS-like.</text>
</svg>
