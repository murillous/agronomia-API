openapi: 3.0.3
info:
  title: Ciclus Weather API
  description: |
    Documentação humana da API intermediária que recebe dados da estação Ciclus.
    Escrevemos em linguagem direta, para humanos. Evitamos jargões quando possível.

    Observações:
    - Timestamps (`ts`) vêm como string com epoch em milissegundos (13 dígitos).
    - Webhook protegido por `x-api-key`.
    - Armazenamento em Firestore, coleção `weather_data`.
  version: 1.2.0
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
  - url: https://agronomia-api.vercel.app
    description: Produção (Vercel)

tags:
  - name: Saúde
    description: Verificações de status
  - name: Clima
    description: Consulta a dados meteorológicos
  - name: Webhook
    description: Recebimento de dados da estação

paths:
  /api/health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está saudável
      description: Retorna status, versão e se a conexão com Firebase está funcionando.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  version: { type: string, example: 1.2.0 }
                  firebase: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
                  environment: { type: string, example: development }
        '500':
          description: Problemas na saúde da API

  /api/weather/latest:
    get:
      tags: [Clima]
      summary: Lista leituras mais recentes
      description: Consulta os últimos registros meteorológicos, ordenados por `ts` desc.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Quantidade máxima de itens (1–100). Default 20.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  limit: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherRecord'
        '400':
          description: Parâmetro inválido
        '500':
          description: Erro interno ao consultar dados

  /api/weather/period:
    get:
      tags: [Clima]
      summary: Lista leituras em um período
      description: Retorna registros entre `start` e `end` (epoch ms), ordenados por `ts` desc.
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: string, example: '1746466087000' }
          description: Timestamp inicial (epoch ms, 13 dígitos).
        - in: query
          name: end
          required: true
          schema: { type: string, example: '1746552487000' }
          description: Timestamp final (epoch ms, 13 dígitos).
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000 }
          description: Quantidade máxima de itens (1–1000). Default 100.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  period:
                    type: object
                    properties:
                      start: { type: string, format: date-time }
                      end: { type: string, format: date-time }
                      duration: { type: string, example: '24 horas' }
                  count: { type: integer }
                  limit: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherRecord'
        '400':
          description: Parâmetros inválidos
        '500':
          description: Erro interno ao consultar período

  /api/webhook/weather:
    post:
      tags: [Webhook]
      summary: Recebe dados da estação Ciclus
      description: Endpoint protegido que valida os dados recebidos, padroniza e salva no Firestore.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingWeatherPayload'
      responses:
        '200':
          description: Dados recebidos e armazenados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  documentId: { type: string }
                  timestamp: { type: string, example: '1746466087000' }
                  workingSensors: { type: integer, example: 6 }
                  warnings:
                    type: array
                    items: { type: string }
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado (x-api-key ausente ou inválido)
        '500':
          description: Erro interno ao processar dados

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    IncomingWeatherPayload:
      type: object
      description: Payload bruto enviado pela estação. Campos ausentes indicam sensores offline.
      properties:
        IdEstacao: { type: integer, example: 123 }
        ts: { type: string, example: '1746466087000' }
        Temperatura: { type: number, format: float, example: 26.4 }
        Umidade: { type: number, format: float, example: 68 }
        Pressao: { type: number, format: float, example: 1012 }
        PluviometroH: { type: integer, example: 0 }
        PluviometroD: { type: integer, example: 2 }
        VelocidadeMedia: { type: number, format: float, example: 2.4 }
        VelocidadeMax: { type: number, format: float, example: 5.0 }
        DirecaoVento: { type: integer, example: 180 }
        UmidadeSolo: { type: number, format: float, example: 30 }
        TemperaturaSolo: { type: number, format: float, example: 22 }
        Solarizacao: { type: integer, example: 240 }
        RSSI: { type: integer, example: -70 }
        Bateria: { type: integer, example: 87 }
        VersaoSw: { type: string, example: '1.0.0' }
        VersaoPcb: { type: string, example: 'A2' }
      required:
        - IdEstacao
        - ts

    WeatherRecord:
      type: object
      description: Registro armazenado no Firestore após limpeza/padronização.
      properties:
        id: { type: string }
        IdEstacao: { type: integer }
        ts: { type: string, description: 'epoch ms em string' }
        Temperatura: { type: number }
        Umidade: { type: number }
        Pressao: { type: number }
        VelocidadeMedia: { type: number }
        Solarizacao: { type: integer }
        processedAt: { type: string, format: date-time }
        apiVersion: { type: string, example: '1.2.0' }
